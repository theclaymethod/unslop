name: evals

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  repository-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all scripts
        run: python -m py_compile scripts/*.py evals/*.py
      - name: Lint
        run: pipx install ruff && ruff check .
      - name: Install skill benchmark harness
        run: pipx install git+https://github.com/adewale/skill-eval-harness.git
      - name: Run repository checks
        run: python3 evals/check.py
